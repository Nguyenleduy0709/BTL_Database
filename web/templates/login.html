{% extends "auth_layout.html" %}
{% block account_content %}
<h2>Đăng nhập</h2>
<p class="subtle">Đăng nhập để vào lớp và xem tiến độ học của bạn.</p>
<form method="post">
  {% csrf_token %}
  {% include "partials/form_fields.html" %}
  <button class="button button-primary login-button" type="submit">Đăng nhập</button>
</form>
<div class="account-links">
  <a href="{% url 'reset_password' %}">Quên mật khẩu?</a>
  <a href="{% url 'register_account' %}">Tạo tài khoản học viên</a>
</div>
{% endblock %}
