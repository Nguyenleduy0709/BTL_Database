{{ form.non_field_errors }}
{% for field in form %}
<div class="field {% if field.field.widget.input_type == 'checkbox' %}field-checkbox{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}{{ field }} {{ field.label_tag }}
  {% else %}{{ field.label_tag }}{{ field }}{% endif %}
  {{ field.errors }}
  {% if field.help_text %}<p class="muted">{{ field.help_text }}</p>{% endif %}
</div>
{% endfor %}
